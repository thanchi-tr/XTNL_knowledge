plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "org.jetbrains.kotlin.plugin.serialization"
}

// The server the app talks to until the user picks another (gradle.properties: xtnl.server).
def defaultServer = (project.findProperty("xtnl.server") ?: "https://xtnl-knowledge-xpis.vercel.app").toString()

android {
    namespace "com.xtnl.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.xtnl.app"
        minSdk 26
        targetSdk 35
        versionCode 28
        versionName "2.16"
        buildConfigField "String", "DEFAULT_SERVER", "\"${defaultServer}\""
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
        unitTests.all {
            // ScreensTest renders every screen at the Fold's sizes (Robolectric) only when asked:
            // gradlew test -Pxtnl.shots=true   → PNGs in app/build/screens/
            systemProperty "xtnl.shots", (project.findProperty("xtnl.shots") ?: "false").toString()
            systemProperty "xtnl.shots.dir", file("build/screens").absolutePath
            maxHeapSize = "2g"
        }
    }

    lint {
        // Lint is advisory here; the build should not fail on a translation nag.
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }
}

dependencies {
    def composeBom = platform("androidx.compose:compose-bom:2024.11.00")
    implementation composeBom

    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"
    implementation "androidx.window:window:1.3.0"
    implementation "androidx.webkit:webkit:1.12.1"

    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.animation:animation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"

    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    // Blueprint P27 (D22): walks, hikes and weight read from Health Connect, synced by a WorkManager job (off until
    // the user turns it on in Settings).
    implementation "androidx.health.connect:connect-client:1.1.0-alpha10"
    implementation "androidx.work:work-runtime-ktx:2.9.1"

    testImplementation composeBom
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0"
    // Screen renders on the JVM (ScreensTest, opt-in).
    testImplementation "org.robolectric:robolectric:4.14.1"
    testImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation composeBom
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}
