apply plugin: "com.android.application"

// The address the shell opens until the user changes it (gradle.properties: xtnl.url).
def startUrl = (project.findProperty("xtnl.url") ?: "http://10.0.2.2:3000").toString()

android {
    namespace "com.xtnl.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.xtnl.app"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "START_URL", "\"${startUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

