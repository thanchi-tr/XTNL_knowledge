org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.nonTransitiveRClass=true
# The address the app opens on first launch. 10.0.2.2 is this PC as seen from
# the Android emulator; for a phone on USB run `adb reverse tcp:3000 tcp:3000`
# and use http://localhost:3000; for real use, the deployed https address.
# Override per build: gradlew assembleDebug -Pxtnl.url=https://example.com
# The app can also change it at run time (long-press the icon → Change address).
xtnl.url=http://10.0.2.2:3000
