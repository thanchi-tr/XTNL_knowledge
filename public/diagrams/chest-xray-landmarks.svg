<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Stylised PA chest radiograph">
  <!-- A teaching sketch, not a radiograph. Hotspots in the seed sit at
       (0.5, 0.18) the clavicles' medial ends, (0.5, 0.45) the cardiac
       silhouette, (0.3, 0.7) the right costophrenic angle (image left). -->
  <defs>
    <radialGradient id="tissue" cx="50%" cy="45%" r="65%">
      <stop offset="0" stop-color="#4a4d52"/>
      <stop offset="1" stop-color="#26282c"/>
    </radialGradient>
    <linearGradient id="lung" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0c0e"/>
      <stop offset="1" stop-color="#16181b"/>
    </linearGradient>
    <radialGradient id="heart" cx="45%" cy="40%" r="70%">
      <stop offset="0" stop-color="#a3a6ab"/>
      <stop offset="1" stop-color="#6e7176"/>
    </radialGradient>
  </defs>
  <rect width="400" height="500" fill="#050506"/>
  <!-- soft tissue of the thorax and shoulders -->
  <path d="M20 120 Q40 70 120 62 L160 40 Q200 30 240 40 L280 62 Q360 70 380 120 L392 470 Q200 500 8 470 Z" fill="url(#tissue)"/>
  <!-- lungs -->
  <path d="M175 108 Q150 92 128 100 Q86 128 72 210 Q64 290 86 334 L117 352 Q150 316 190 304 Q186 220 175 108 Z" fill="url(#lung)"/>
  <path d="M225 108 Q250 92 272 100 Q314 128 328 210 Q336 290 314 334 L283 352 Q250 330 212 312 Q214 220 225 108 Z" fill="url(#lung)"/>
  <!-- ribs -->
  <g fill="none" stroke="#bfc2c7" stroke-opacity=".38" stroke-width="7" stroke-linecap="round">
    <path d="M188 112 Q120 104 84 150"/><path d="M212 112 Q280 104 316 150"/>
    <path d="M188 140 Q112 130 74 186"/><path d="M212 140 Q288 130 326 186"/>
    <path d="M188 170 Q108 160 70 222"/><path d="M212 170 Q292 160 330 222"/>
    <path d="M188 200 Q106 192 70 258"/><path d="M212 200 Q294 192 330 258"/>
    <path d="M188 232 Q108 224 74 292"/><path d="M212 232 Q292 224 326 292"/>
    <path d="M188 264 Q112 258 84 322"/><path d="M212 264 Q288 258 316 322"/>
  </g>
  <!-- spine -->
  <g fill="#d6d8db" fill-opacity=".35">
    <rect x="186" y="60" width="28" height="22" rx="5"/><rect x="186" y="86" width="28" height="22" rx="5"/>
    <rect x="186" y="112" width="28" height="22" rx="5"/><rect x="186" y="138" width="28" height="22" rx="5"/>
    <rect x="186" y="164" width="28" height="22" rx="5"/><rect x="186" y="190" width="28" height="22" rx="5"/>
    <rect x="186" y="216" width="28" height="22" rx="5"/><rect x="186" y="242" width="28" height="22" rx="5"/>
    <rect x="186" y="268" width="28" height="22" rx="5"/><rect x="186" y="294" width="28" height="22" rx="5"/>
  </g>
  <!-- cardiac silhouette (apex to the patient's left, image right) -->
  <path d="M184 196 Q176 250 168 296 Q190 340 250 336 Q306 330 300 280 Q294 226 238 206 Q212 196 184 196 Z" fill="url(#heart)" fill-opacity=".9"/>
  <!-- diaphragm domes -->
  <path d="M86 334 Q104 300 150 296 Q186 296 200 330 Q214 300 250 300 Q296 300 314 334" fill="none" stroke="#8d9095" stroke-width="3"/>
  <!-- clavicles -->
  <g fill="none" stroke="#e4e6e9" stroke-width="10" stroke-linecap="round">
    <path d="M190 92 Q150 98 120 84 Q90 72 60 80"/>
    <path d="M210 92 Q250 98 280 84 Q310 72 340 80"/>
  </g>
  <!-- the side marker a film carries -->
  <text x="26" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#e4e6e9">R</text>
</svg>
